name: ci

on:
  push:
    tags:
      - "v*.*.*.*"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    name: Prepare release
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      version: ${{ steps.prepare.outputs.version }}
      release_ref: ${{ steps.prepare.outputs.release_ref }}
      nvim_version: ${{ steps.prepare.outputs.nvim_version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve release version
        id: prepare
        run: bash scripts/ci-prepare-release.sh

  smoke:
    if: needs.prepare.outputs.should_release == 'true'
    name: Smoke (${{ matrix.system }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Verify runner architecture
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      - name: Cache vim.pack plugins
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/nvime-pack/data
            ${{ runner.tool_cache }}/nvime-pack/cache
          key: vim-pack-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.nvim_version }}-${{ hashFiles('nvim-pack-lock.json') }}
          restore-keys: |
            vim-pack-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.nvim_version }}-
      - name: Prepare and verify native Blink libraries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVIME_XDG_DATA_HOME: ${{ runner.tool_cache }}/nvime-pack/data
          NVIME_XDG_CACHE_HOME: ${{ runner.tool_cache }}/nvime-pack/cache
        run: nix develop .#ci --no-write-lock-file --command bash scripts/ci-smoke.sh

  package:
    if: needs.prepare.outputs.should_release == 'true'
    name: Package (${{ matrix.system }})
    needs: [prepare, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_ref }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Verify runner architecture
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      - name: Restore vim.pack plugins
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/nvime-pack/data
            ${{ runner.tool_cache }}/nvime-pack/cache
          key: vim-pack-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.nvim_version }}-${{ hashFiles('nvim-pack-lock.json') }}
          restore-keys: |
            vim-pack-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.prepare.outputs.nvim_version }}-
      - name: Build and test installed bundle
        id: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVIME_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          NVIME_XDG_DATA_HOME: ${{ runner.tool_cache }}/nvime-pack/data
          NVIME_XDG_CACHE_HOME: ${{ runner.tool_cache }}/nvime-pack/cache
        run: nix develop .#ci --no-write-lock-file --command bash scripts/ci-package.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

  release:
    if: needs.prepare.outputs.should_release == 'true'
    name: Release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: nvime-*
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
