name: checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Locked CI tools and quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check scripts, Lua and workflows
        shell: nix develop .#ci --no-write-lock-file --command bash -euo pipefail {0}
        run: |
          for script in scripts/*.sh arch-install.sh .githooks/pre-commit; do
            bash -n "$script"
          done
          bash scripts/ci-lua-syntax.sh
          stylua --check .
          selene .
          nixfmt --check flake.nix
          actionlint
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("scripts/ci-blink.py").read_text())'

      - name: Evaluate all supported flake platforms
        run: nix flake check --all-systems --no-build --no-write-lock-file
